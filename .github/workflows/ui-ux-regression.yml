name: UI UX regression

on:
  push:
    branches:
      - master
      - codex/ui-ux-audit-improvements
  pull_request:

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  windows-ui-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run workflow, migration, localization, and UI smoke tests
        run: >-
          python -m pytest -q
          tests/test_import_workflow_state.py
          tests/test_processed_messages.py
          tests/test_milestone_record_source.py
          tests/test_message_review_ui.py
          tests/test_ui_translation_completeness.py
          tests/test_responsive_layout.py
